name: Deploy NodeJS application to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest      

    steps: 
      - name: checkout code
        uses: actions/checkout@v4

      - name: deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{secrets.SSH_KEY}}
          script:
            cd /home/ubuntu/nodejs-application-deploy-github-actions && git pull && docker compose up -d --build
